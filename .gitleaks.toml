[extend]
useDefault = true

# No entropy minimum: even a short literal Django key must fail TC-40.
[[rules]]
id = "django-secret-key-literal"
description = "Hard-coded Django secret key"
regex = '''(?:\b(?:DJANGO_)?SECRET_KEY\s*=\s*|\bos\.environ\.setdefault\(\s*["']DJANGO_SECRET_KEY["']\s*,\s*)["']([^"'\r\n]+)["']'''
secretGroup = 1

[[rules.allowlists]]
description = "Exact test-only settings key"
condition = "AND"
paths = ['''^tests/settings\.py$''']
regexes = ['''^test-only-key-never-use-in-production$''']

[[rules.allowlists]]
description = "Example environment placeholder"
condition = "AND"
paths = ['''^\.env\.example$''']
regexes = ['''^replace-with-a-generated-secret-key$''']

[[rules]]
id = "django-secret-key-env"
description = "Hard-coded unquoted Django secret key in an env assignment"
regex = '''(?m)^\s*(?:export\s+)?(?:DJANGO_)?SECRET_KEY\s*=\s*([A-Za-z0-9_./+!=-]+)\s*(?:#.*)?$'''
secretGroup = 1

[[rules.allowlists]]
description = "Example environment placeholder"
condition = "AND"
paths = ['''^\.env\.example$''']
regexes = ['''^replace-with-a-generated-secret-key$''']
