services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: vps-web
    build: .
    env_file: &web-env-file
      - .env
    environment: &web-environment
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - python manage.py migrate && exec python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  scheduler:
    image: vps-web
    build: .
    env_file: *web-env-file
    environment: *web-environment
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    command:
      - sh
      - -c
      - while true; do python manage.py expire_no_shows; sleep 60; done
    volumes:
      - .:/app

volumes:
  postgres_data:
