<!doctype html>
<!-- Placeholder to be replaced by issue #17. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VPS{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 70rem; margin: auto; padding: 1rem; }
    header, .message { padding: 1rem; background: #eef4ef; margin-bottom: 1rem; }
    th, td { text-align: left; padding: .5rem; } .errorlist { color: #a11212; }
    .field { margin-bottom: 1rem; } form.inline { display: inline; }
  </style>
</head>
<body>
  <header>Vehicle Parking System
    {% if user.is_authenticated %} — {{ user.email }} ({{ user.get_role_display }}){% endif %}
  </header>
  {% for message in messages %}<div class="message" role="status">{{ message }}</div>{% endfor %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
