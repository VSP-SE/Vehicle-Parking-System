<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VPS{% endblock %}</title>

  <script src="https://unpkg.com/htmx.org@2.0.4"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0 auto;
      padding: 1rem;
      max-width: 70rem;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      color: #17251d;
      background: #f8faf8;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #e5eee7;
      border-radius: .5rem;
    }

    .brand { font-size: 1.2rem; font-weight: 700; }
    .user-info { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }

    a, button { color: #14532d; }
    a { overflow-wrap: anywhere; }

    button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding: .65rem .9rem;
      border: 1px solid #24643b;
      border-radius: .35rem;
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible, a:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    .message {
      padding: .85rem 1rem;
      margin-bottom: 1rem;
      border: 1px solid;
      border-radius: .35rem;
      overflow-wrap: anywhere;
    }

    .message-success { color: #14532d; background: #dcfce7; border-color: #86efac; }
    .message-error { color: #991b1b; background: #fee2e2; border-color: #fca5a5; }
    .message-warning { color: #854d0e; background: #fef3c7; border-color: #fcd34d; }
    .message-info { color: #1e40af; background: #dbeafe; border-color: #93c5fd; }

    main { min-width: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .65rem; border-bottom: 1px solid #d1d5db; }
    .errorlist { color: #a11212; }
    .field { margin-bottom: 1rem; }
    form.inline { display: inline; }

    input, select, textarea {
      max-width: 100%;
      min-height: 44px;
      padding: .5rem;
      font: inherit;
    }

    @media (max-width: 480px) {
      body { padding: .5rem; }
      header { align-items: flex-start; flex-direction: column; }
      .user-info { align-items: flex-start; flex-direction: column; }
      table { display: block; overflow-x: auto; }

    
.gate-page {
  max-width: 64rem;
  margin: 1.5rem auto;
}

.gate-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.gate-heading h1 {
  margin-bottom: .25rem;
}

.gate-heading p,
.gate-panel p,
.gate-footnote {
  color: #4b5563;
}

.gate-status {
  padding: .4rem .7rem;
  border-radius: 999px;
  background: #dcfce7;
  color: #166534;
  font-size: .875rem;
}

.gate-modes {
  display: flex;
  flex-wrap: wrap;
  gap: .75rem;
  margin-bottom: 1.25rem;
}

.gate-mode {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: .6rem 1rem;
  border: 1px solid #9ca3af;
  border-radius: .4rem;
  background: #fff;
  font-weight: 600;
  text-decoration: none;
}

.gate-panels {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}

.gate-panel {
  min-width: 0;
  padding: 1.25rem;
  background: #fff;
  border: 1px solid #d1d5db;
  border-radius: .65rem;
  scroll-margin-top: 1rem;
}

.gate-panel:last-child {
  grid-column: 1 / -1;
}

.gate-panel h2 {
  margin-top: 0;
  font-size: 1.2rem;
}

.gate-form {
  display: grid;
  gap: .65rem;
}

.gate-form label {
  font-weight: 600;
}

.gate-form input,
.gate-form select {
  width: 100%;
  min-width: 0;
  border: 1px solid #9ca3af;
  border-radius: .35rem;
}

.gate-form button {
  width: 100%;
  margin-top: .35rem;
  background: #166534;
  color: #fff;
  font-weight: 600;
}

.gate-form button:disabled {
  background: #9ca3af;
  border-color: #9ca3af;
  cursor: not-allowed;
}

.gate-mode:focus-visible,
.gate-form input:focus-visible,
.gate-form select:focus-visible,
.gate-form button:focus-visible {
  outline: 3px solid #2563eb;
  outline-offset: 3px;
}

.gate-footnote {
  margin-top: 1.25rem;
  font-size: .9rem;
}

@media (max-width: 640px) {
  .gate-panels {
    grid-template-columns: minmax(0, 1fr);
  }

  .gate-panel:last-child {
    grid-column: auto;
  }

  .gate-panel {
    padding: 1rem;
  }
}

    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Vehicle Parking System</div>
    {% if user.is_authenticated %}
      <div class="user-info">
        <span>{{ user.email }} ({{ user.get_role_display }})</span>
        {% block sign_out %}{% endblock %}
      </div>
    {% endif %}
  </header>

  {% for message in messages %}
    <div
      class="message message-{{ message.tags|default:'info' }}"
      {% if 'error' in message.tags %}role="alert"{% else %}role="status"{% endif %}
      aria-live="{% if 'error' in message.tags %}assertive{% else %}polite{% endif %}">
      {{ message }}
    </div>
  {% endfor %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
