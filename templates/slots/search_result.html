{% if search_error %}
  <div class="message message-error" role="alert">
    {{ search_error }}
  </div>
{% elif slot_count != None %}
  <section class="search-result" aria-labelledby="results-heading">
    <h2 id="results-heading">Parking availability</h2>
    <p>
      <strong>{{ slot_count }}</strong>
      suitable slot{{ slot_count|pluralize }} available for your selected window.
    </p>
    {% if confirm_url and slot_count %}
      <form method="post" action="{{ confirm_url }}" class="booking-form">
        {% csrf_token %}
        <input type="hidden" name="lot" value="{{ selected_lot }}">
        <input type="hidden" name="vehicle" value="{{ selected_vehicle }}">
        <input type="hidden" name="start" value="{{ start }}">
        <input type="hidden" name="end" value="{{ end }}">
        <button type="submit">Book a slot</button>
      </form>
    {% endif %}
  </section>
{% endif %}
