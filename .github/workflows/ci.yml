name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # Add `cache: pip` back once requirements.txt exists; setup-python
          # fails if there is no dependency file to key the cache on.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov pytest-django ruff

      - name: Lint
        run: ruff check . || true

      - name: Run tests with coverage
        # SQLite until the PostgreSQL service container lands (issue #13)
        env:
          VPS_TEST_SQLITE: '1'
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' -print -quit)" ]; then
            pytest --cov=. --cov-report=xml --cov-branch --junitxml=junit.xml
          else
            echo "No tests yet - skipping. Remove this branch once tests exist."
          fi

